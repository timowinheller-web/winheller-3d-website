<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Winheller 3D</title>
<meta name="description" content="Winheller 3D – personalisierte Figuren aus dem 3D-Drucker.">
<style>
  :root { --bg:#F7F7F4; --fg:#14161A; --muted:#5B6270; --accent:#247BFF; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0B0F17; --fg:#EEF1F6; --muted:#9AA3B2; } }
  * { box-sizing:border-box; margin:0; }
  body { min-height:100svh; display:grid; place-items:center; padding:24px 16px;
         background:var(--bg); color:var(--fg); font:17px/1.6 system-ui,-apple-system,sans-serif; }
  main { max-width:560px; }
  h1 { font-size:clamp(2.2rem,7vw,3.6rem); line-height:1.05; letter-spacing:-.02em; }
  h1 span { color:var(--accent); }
  p { margin-top:16px; color:var(--muted); }
  a { color:var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Winheller <span>3D</span></h1>
  <p>Personalisierte Figuren aus dem 3D-Drucker. Die Website ist im Aufbau.</p>
  <p>Kontakt: <a href="mailto:info@winheller-3d.com">info@winheller-3d.com</a></p>
</main>
</body>
</html>
